<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PROJECTS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/2025.png" />
    <link rel="stylesheet" href="../styles/projects.css">
    <!-- Google Fonts for Japanese/english mix -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Particles Background -->
    <div class="particles" id="particles"></div>

    <!-- Navigation -->
    <div class="filter">
        <nav id="navbar">
            <div class="nav-container">
                <div class="logo"><img src="./assets/2026.png" alt=""></div>
                <ul class="nav-links">
                    <li><a href="..intex.html">HOME</a></li>
                    <li><a href="../events/">EVENTS</a></li>
                    <li><a href="../about-us/">ABOUT</a></li>
                    <li><a href="../contact-us/">Contact</a></li>
                </ul>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero" id="home">
            <div class="hero-content">
                <h1>We Are Building Something Big</h1>
                <p>Redefining Tomorrow</p>
            </div>
        </section>

        <section class="cta">
            <div class="cta-content">
                <h2>Experience the Future</h2>
                <a href="#" class="cta-button">NOTIFY ME</a>
            </div>
        </section>
    </div>

    <script>
        // Custom Cursor
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-follower');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            setTimeout(() => {
                follower.style.left = e.clientX - 10 + 'px';
                follower.style.top = e.clientY - 10 + 'px';
            }, 100);
        });

        // Navbar Scroll Effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (20 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, index * 100);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.feature-card').forEach(card => {
            observer.observe(card);
        });

        document.querySelector('.cta-button').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt('Please enter your email to be notified:');
            if (email) {
                alert('You will be notified with the latest updates at ' + email);
                // Optional: Add logic here to save/store the email or send to backend
            } else {
                alert('Email not provided. Please try again.');
            }
        });
    </script>



</body>
