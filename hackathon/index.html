<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Game On — Landing</title>
    <link rel="icon" type="image/png" href="../assets/fevicon.png" />
    <link href="https://db.onlinewebfonts.com/c/a80642e8812e424f0a65182894ef9adf?family=NORMAL" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/971acb87c659747f679da93ec5431d54?family=Reguler" rel="stylesheet">
    <link rel="stylesheet" href="../styles/damn.css"/>
    <meta name="description" content="Futuristic gaming landing page — Game On." />
    <!-- <link rel="stylesheet" href="damn.css" /> -->
    
  </head>
  <body>
    <header class="site-header" role="banner">
        <a href="/hackathon/">
          <img src="../assets/logo.png" alt="nimesha logo" class="logo">
        </a>
        <nav class="header-nav">
            <a href="/">HOME</a>
            <a href="../about/">THEME</a>
            <a href="../about/">Timeline</a>
            <a href="../contact-us/">Contact Us</a>
            <a href="#register" class="btn-register">REGISTER</a>
        </nav>
    </header>

    <main class="hero" role="main">
      <section class="left-pane">
        <img
          class="left-logo"
          src="../assets/event posters.png"
          alt="Hackathon Logo Placeholder"
        />
        <div class="sponsors">
          <p>partners</p>
          <div class="image-grid">
            <a target="_blank" href="">
              <img src="../assets/ipuiif.png">
            </a>
            <a>
              <img src="../assets/ipu.png">
            </a>
            <a>
              <img src="../assets/elysian.png">
            </a>
          </div>
          <div class="image-grid2">
            <a target="_blank" href="https://ethindia2024.devfolio.co/overview">
              <img src="../assets/ETHIndia.png">
            </a>
            <a target="_blank" href="https://devfolio.co/">
              <img src="../assets/Devfolio.png">
            </a> 
          </div>
        </div>
      </section>

      <div class="center-image-container" aria-hidden="true">
        <img
          class="hero-image"
          src="../assets/redbg.png"
          alt="Futuristic astronaut in a green-lit environment"
        />
        <img
          class="flame-image"
          src="../assets/flames.png"
          alt="Futuristic astronaut in a green-lit environment"
        />
        <img
          class="bhangi-full-screen"
          src="../assets/astr.png"
          alt="Bhangi Astronaut Full Screen"
        />
      </div>

      <div 
        class="apply-button dev-button" 
        data-hackathon-slug="Nimesha" 
        data-button-theme="dark-inverted"
        style="height: 44px; width: 312px"
      ></div>
    </main>

    <script defer async src="https://apply.devfolio.co/v2/sdk.js"></script>
  </body>
</html>
