<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Game On — Landing</title>
    <link rel="icon" type="image/png" href="../assets/fevicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/damn.css"/>
    <meta name="description" content="Futuristic gaming landing page — Game On." />
    <!-- <link rel="stylesheet" href="damn.css" /> -->
    
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="left-header">
        <span class="menu-icon" onclick="toggleMenu()">☰</span>
        <a href="/hackathon/">
          <img src="../assets/2026.png" alt="nimesha logo" class="logo">
        </a>
      </div>
      
      <nav class="header-nav">
        <ul class="menuList">
          <a href="/">HOME</a>
          <a href="../about/">THEME</a>
          <a target="_blank" href="../assets/Nimesha_rulebook_final.pdf">Guidelines</a>
          <a href="../contact-us/">Contact Us</a>
        </ul>
        <div 
          class="apply-button devfolio-button" 
          data-hackathon-slug="nimesha" 
          data-button-theme="light"
          style="height: 36px; width: 256px"
        ></div>
      </nav>
    </header>
    <nav class="toggle-nav">
      <ul class="toggleMenu">
        <li><a href="/"><img class="icon" src="../assets/home.png">HOME</a></li>
        <li><a href="../about/"><img class="icon" src="../assets/web-design.png">THEME</a></li>
        <li><a href="../about/"><img class="icon" src="../assets/timeline.png">Timeline</a></li>
        <li>
          <a href="../contact-us/"><img class="icon" src="../assets/contact-mail.png">Contact Us</a>
        </li>
      </ul>
    </nav>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <main class="hero" role="main">
      <div class="left-pane">
        <div class="karu">
          <p class="carnival">KARUYANTRA CARNIVAL</p>
          <p class="present">PRESENTS</p>
        </div> 
        <div>
          <img
            class="left-logo"
            src="../assets/event posters.png"
            alt="Hackathon Logo Placeholder"
          />
        </div>
        <div class="partners">
          <p>Partners</p>
          <div>
            <img src="../assets/Devfolio.png">
            <img src="../assets/ETHIndia.png">
          </div>
        </div>
      </div>

      <div class="center-image-container" aria-hidden="true">
        <img
          class="hero-image"
          src="../assets/redbg.png"
          alt="Futuristic astronaut in a green-lit environment"
        />
        <img
          class="flame-image"
          src="../assets/flames.png"
          alt="Futuristic astronaut in a green-lit environment"
        />
        <img
          class="bhangi-full-screen"
          src="../assets/astr.png"
          alt="Bhangi Astronaut Full Screen"
        />
      </div>

      <div class="right-pane">
        <p class="prize-heading">PRIZE POOL WORTH</p>
        <p class="prize-amount">&#8377;1,00,000+</p>
        <div>
          <div class="details">
            <img class="details-logo" src="../assets/location.png">
            <div>
              <p class="info">GGSIPU EDC</p>
              <p class="info">USAR</p>
            </div>
          </div>
          <div class="details">
            <img class="details-logo" src="../assets/calendar.png">
            <div>
              <p class="info">15-16</p>
              <p class="info">OCT 2025</p>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="promo">
          <img class="ipu-logo" src="../assets/ipu.png">
        </div>
        <div class="promo">
          <img class="elysian-logo" src="../assets/elysian.png">
        </div>
      </div>
    </main>

    <script defer async src="https://apply.devfolio.co/v2/sdk.js"></script>
    <script>
      function toggleMenu() {
        const menu = document.querySelector(".toggleMenu");
        menu.classList.toggle("active");
        document.querySelector('#overlay').classList.toggle('active');
      }
    </script>
  </body>
</html>
